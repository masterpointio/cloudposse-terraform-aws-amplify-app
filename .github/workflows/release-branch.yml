---
name: release-branch
on:
  push:
    branches:
      - main
      - release/v*
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - 'examples/**'
      - 'test/**'

permissions: {}

jobs:
  terraform-module:
    uses: cloudposse/github-actions-workflows-terraform-module/.github/workflows/release-branch.yml@fcbe2ddadb80fa7f643d2a5cb703c31d3e5bbf05 # v0.165.0
    secrets: inherit
